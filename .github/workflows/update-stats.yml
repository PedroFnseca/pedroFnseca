name: Generate GitHub Profile Stats

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'github-stats/**'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./github-stats
        run: npm install

      - name: Generate SVG
        working-directory: ./github-stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run generate

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Adiciona apenas o SVG gerado
          git add github-stats/output/profile.svg
          
          # Faz o commit apenas se houver mudanças reais
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update GitHub profile stats"
          git push
